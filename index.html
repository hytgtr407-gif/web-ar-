<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Min Opera AR Semantic Reading</title>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:"Noto Serif SC",serif}
#info{
position:fixed;right:15px;top:15px;
width:260px;padding:15px;
background:#10241ddd;color:#f4dfaa;
border:1px solid #b9924c;
z-index:10;border-radius:12px
}
</style>
</head>

<body>

<div id="info">
<h3>《贬官记》AR阅读</h3>
<div id="text">等待识别...</div>
<div id="gate">Semantic Gate: LOCKED</div>
</div>

<script>

let sceneData={};

fetch("./assets/data/scene.json")
.then(r=>r.json())
.then(d=>sceneData=d);


function semantic_gate_check(data){
return data.audited===true &&
data.version_matched===true &&
data.resource_valid===true;
}


async function startAR(){

const mindarThree=new MINDAR.IMAGE.MindARThree({
container:document.body,
imageTargetSrc:"./assets/targets/bgji_targets.mind"
});

const {renderer,scene,camera}=mindarThree;

const anchor0=mindarThree.addAnchor(0);

anchor0.onTargetFound=()=>{

const data=sceneData["BGJ_CHAR_008"];

document.querySelector("#text").innerHTML=
data.title+"<br>"+data.description;

document.querySelector("#gate").innerHTML=
semantic_gate_check(data)?
"Semantic Gate: PASS":
"Semantic Gate: BLOCK";

};

anchor0.onTargetLost=()=>{

document.querySelector("#text").innerHTML=
"Tracking lost. Waiting...";

};


await mindarThree.start();

renderer.setAnimationLoop(()=>{
renderer.render(scene,camera);
});

}

startAR();

</script>

</body>
</html>
