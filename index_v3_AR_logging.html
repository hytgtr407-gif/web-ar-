<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《贬官记》WebAR阅读系统</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
#info{
position:fixed;
top:15px;
right:15px;
z-index:999;
background:#10251fdd;
color:#f5dfaa;
border:1px solid #c9a85c;
padding:15px;
border-radius:12px;
font-family:serif;
width:230px;
}
</style>
</head>

<body>

<div id="info">
<h3>《贬官记》AR阅读</h3>
<div id="status">正在启动相机...</div>
<div id="content">等待识别角色卡</div><button onclick="exportLogs()">导出实验日志</button>
</div>

<a-scene
mindar-image="imageTargetSrc: ./assets/targets/bgji_targets.mind; autoStart: true;"
color-space="sRGB"
renderer="colorManagement: true, physicallyCorrectLights"
vr-mode-ui="enabled:false"
device-orientation-permission-ui="enabled:false">

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity mindar-image-target="targetIndex:0" id="target0">
<a-plane
position="0 0 0"
width="1"
height="1.4"
material="color:#d4af37; opacity:0.25">
</a-plane>
</a-entity>

<a-entity mindar-image-target="targetIndex:1" id="target1">
</a-entity>

<a-entity mindar-image-target="targetIndex:2" id="target2">
</a-entity>

</a-scene>

<script>


const data=[
{id:"BGJ_CHAR_008",name:"崔云龙",desc:"《贬官记》人物卡：崔云龙"},
{id:"BGJ_CHAR_007",name:"张岫玉",desc:"《贬官记》人物卡：张岫玉"},
{id:"BGJ_CHAR_006",name:"边一笑",desc:"《贬官记》人物卡：边一笑"}
];

const logs=[];
const userID="anonymous_"+Math.random().toString(36).substring(2,8);
const sessionStart=Date.now();

function logEvent(eventName,targetID){
 const log={
  user_id:userID,
  target_id:targetID,
  event:eventName,
  timestamp:new Date().toISOString(),
  elapsed_ms:Date.now()-sessionStart
 };
 logs.push(log);
 console.log(log);
}

function show(i){
 document.querySelector("#status").innerHTML="识别成功";
 document.querySelector("#content").innerHTML=data[i].name+"<br>"+data[i].desc;
 logEvent("target_found",data[i].id);
}

target0.addEventListener("targetFound",()=>show(0));
target1.addEventListener("targetFound",()=>show(1));
target2.addEventListener("targetFound",()=>show(2));

target0.addEventListener("targetLost",()=>logEvent("target_lost","BGJ_CHAR_008"));
target1.addEventListener("targetLost",()=>logEvent("target_lost","BGJ_CHAR_007"));
target2.addEventListener("targetLost",()=>logEvent("target_lost","BGJ_CHAR_006"));

function exportLogs(){
 let csv="user_id,target_id,event,timestamp,elapsed_ms\n";
 logs.forEach(l=>{
  csv+=`${l.user_id},${l.target_id},${l.event},${l.timestamp},${l.elapsed_ms}\n`;
 });
 let blob=new Blob([csv],{type:"text/csv"});
 let url=URL.createObjectURL(blob);
 let a=document.createElement("a");
 a.href=url;
 a.download="AR_interaction_logs.csv";
 a.click();
}
</script>

</body>
</html>
