<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" font-family="Arial, Microsoft YaHei, sans-serif"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#587387"/></marker></defs><rect width="1400" height="1180" fill="white"/>
<text x="60" y="54" font-size="32" fill="#193247" font-weight="700" text-anchor="start">Semantic Gate Architecture</text>
<text x="60" y="95" font-size="29" fill="#193247" font-weight="600" text-anchor="start">for Verified Cultural Content Delivery</text>
<text x="60" y="137" font-size="24" fill="#476276" font-weight="500" text-anchor="start">面向文化知识可信传递的语义门控架构</text>
<rect x="60" y="185" width="400" height="704" rx="12" fill="#f6f9fc" stroke="#c5d2de" stroke-width="1.6" />
<text x="260" y="224" font-size="20" fill="#243d51" font-weight="700" text-anchor="middle">Recognition &amp; Identity Mapping</text>
<rect x="90" y="260" width="340" height="82" rx="12" fill="#fff" stroke="#b6c8d5" stroke-width="1.6" />
<text x="260" y="294.5" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">Physical Comic Card</text>
<text x="260" y="321.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">实体人物卡 / visual target</text>
<polyline points="260,342 260,386" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="90" y="386" width="340" height="132" rx="12" fill="#fff" stroke="#b6c8d5" stroke-width="1.6" />
<text x="260" y="418.5" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">WebAR Recognition Layer</text>
<text x="260" y="445.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">A-Frame + MindAR.js</text>
<text x="260" y="472.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">targetFound / targetLost</text>
<text x="260" y="499.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">132.5 ms mean recognition latency¹</text>
<polyline points="260,518 260,599" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<rect x="90" y="599" width="340" height="99" rx="12" fill="#fff" stroke="#b6c8d5" stroke-width="1.6" />
<text x="260" y="642" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">Semantic Mapping Layer</text>
<text x="260" y="669" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">targetIndex → character ID</text>
<text x="260" y="747" font-size="15" fill="#557084" font-weight="400" text-anchor="middle">0 = 边一笑 · 1 = 崔云龙 · 2 = 张岫玉</text>
<text x="260" y="779" font-size="15" fill="#557084" font-weight="400" text-anchor="middle">Identity mapping verified against</text>
<text x="260" y="803" font-size="15" fill="#557084" font-weight="400" text-anchor="middle">the compiled target image order</text>
<rect x="500" y="185" width="840" height="704" rx="12" fill="#fcfdff" stroke="#94adc1" stroke-width="1.6" />
<text x="920" y="224" font-size="20" fill="#243d51" font-weight="700" text-anchor="middle">Semantic Gate · Prototype Implementation</text>
<rect x="650" y="261" width="400" height="74" rx="12" fill="#fff" stroke="#b6c8d5" stroke-width="1.6" />
<text x="850" y="291.5" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">Scene Metadata Lookup</text>
<text x="850" y="318.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">assets/data/scene.json (preloaded)</text>
<polyline points="430,648 540,648 540,298 650,298" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<text x="554" y="621" font-size="15" fill="#557084" font-weight="400" text-anchor="middle">ID</text>
<polyline points="850,335 850,366" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<polygon points="850,366 1075,420 850,474 625,420" fill="#edf4f9" stroke="#8fa9bd" stroke-width="1.8"/>
<text x="850" y="413.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">Record readable and identity matched?</text>
<text x="850" y="438.5" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">Valid description available?</text>
<polyline points="850,474 850,512" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<text x="871" y="501" font-size="15" fill="#3e795b" font-weight="400" text-anchor="middle">Yes</text>
<polygon points="850,512 1070,582 850,652 630,582" fill="#edf4f9" stroke="#8fa9bd" stroke-width="1.8"/>
<text x="850" y="563" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">G = audited ∧ version_matched</text>
<text x="850" y="588" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">∧ resource_valid</text>
<text x="850" y="613" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">All three strictly equal true?</text>
<polyline points="1075,420 1212,420 1212,720" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<text x="1100" y="405" font-size="15" fill="#965f3d" font-weight="400" text-anchor="middle">No</text>
<polyline points="1070,582 1212,582" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<text x="1126" y="566" font-size="15" fill="#965f3d" font-weight="400" text-anchor="middle">No</text>
<polyline points="850,652 850,720" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" />
<text x="871" y="688" font-size="15" fill="#3e795b" font-weight="400" text-anchor="middle">Yes</text>
<rect x="566" y="720" width="430" height="122" rx="12" fill="#eaf4ee" stroke="#83ae96" stroke-width="1.6" />
<text x="781" y="761" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">Validated Content Presentation</text>
<text x="781" y="788" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">Cultural text + AR content layer</text>
<text x="781" y="815" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">semantic_gate_pass</text>
<rect x="1020" y="720" width="298" height="122" rx="12" fill="#fff1e7" stroke="#d0a386" stroke-width="1.6" />
<text x="1169" y="761" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">Delivery Blocked</text>
<text x="1169" y="788" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">Status / reason</text>
<text x="1169" y="815" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">semantic_gate_block</text>
<rect x="60" y="940" width="1280" height="93" rx="12" fill="#f6f9fc" stroke="#b6c8d5" stroke-width="1.6" />
<text x="700" y="980" font-size="19" fill="#243d51" font-weight="600" text-anchor="middle">Tracking Loss Fallback</text>
<text x="700" y="1007" font-size="17" fill="#243d51" font-weight="400" text-anchor="middle">targetLost → clear text / hide AR content → prompt rescan</text>
<polyline points="260,889 260,940" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="343" y="919" font-size="15" fill="#557084" font-weight="400" text-anchor="middle">targetLost</text>
<polyline points="60,986 28,986 28,441 90,441" fill="none" stroke="#587387" stroke-width="2.4" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="60" y="1085" font-size="16" fill="#557084" font-weight="400" text-anchor="start">¹ Prior desktop synthetic-video experiment: n = 30, source-frame appearance → real targetFound.</text>
<text x="60" y="1116" font-size="16" fill="#557084" font-weight="400" text-anchor="start">  Excludes startup and this gate; not mobile-camera latency or complete delivery latency.</text>
<text x="60" y="1150" font-size="16" fill="#557084" font-weight="400" text-anchor="start">Validation flags are declared metadata; content auditing and metadata maintenance remain external processes.</text>
</svg>